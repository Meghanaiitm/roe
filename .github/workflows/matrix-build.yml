name: Multi-Platform Matrix Build with Artifacts

on:
  push:
  pull_request:

jobs:
  build:
    name: Build for Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [14, 16, 18]  # 3 variants

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: matrix-6e8074e
        run: echo "Building for Node.js version ${{ matrix.node }}"

      - name: Generate build artifact
        run: |
          echo "Build output for Node version ${{ matrix.node }}" > output-${{ matrix.node }}.txt
          echo "Generated on $(date)" >> output-${{ matrix.node }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-6e8074e-v${{ matrix.node }}
          path: output-${{ matrix.node }}.txt
